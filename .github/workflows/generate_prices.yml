name: Générer cardmarket_prices.json

on:
  push:
    paths:
      - "cardmarket/products_singles.json"
      - "cardmarket/price_guide.json"
  workflow_dispatch:  # permet de relancer manuellement depuis GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Générer les prix
        run: python3 scripts/generate_prices.py --repo-root .

      - name: Commit et push fichiers de prix
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prices/cardmarket_prices.json prices/cardmarket_prices_history.json
          git diff --cached --quiet || git commit -m "Auto: prix Cardmarket mis à jour [$(date '+%Y-%m-%d')]"
          git push
