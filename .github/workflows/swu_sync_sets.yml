name: SWU — Détection nouveaux sets

on:
  schedule:
    # Jeudi et samedi à 5h07 UTC : le site officiel publie surtout le mercredi
    # en fin de journée (UTC), avec des rattrapages jeudi/vendredi.
    - cron: '7 5 * * 4,6'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    strategy:
      fail-fast: false
      matrix:
        branch: [main, staging]

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests Pillow

      - name: Détecter et ajouter les nouveaux sets
        id: sync
        env:
          # GITHUB_REF_NAME vaut toujours la branche par défaut sur un trigger
          # schedule, même si le checkout ci-dessus cible staging — on force la
          # valeur pour que les dataURL générés référencent la bonne branche.
          GITHUB_REF_NAME: ${{ matrix.branch }}
        run: python3 scripts/sync_sets.py --mode sync

      - name: Commit et push si changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sets/ manifest.json announcements*.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau set — rien à commiter."
          else
            git commit -m "Auto [sync]: nouveau(x) set(s) SWU ajouté(s) [$(date '+%Y-%m-%d')] [skip ci]"
            git push origin HEAD:${{ matrix.branch }}
          fi

      # rotation.json est tenu à la main : un set qu'il ne classe pas ne compte pas
      # dans la rotation Premier de l'app. Une seule issue par set (main uniquement,
      # staging détecte les mêmes sets).
      - name: Issue de classement dans rotation.json
        if: matrix.branch == 'main' && steps.sync.outputs.unclassified != ''
        env:
          GH_TOKEN: ${{ github.token }}
          UNCLASSIFIED: ${{ steps.sync.outputs.unclassified }}
        run: |
          for code in ${UNCLASSIFIED//,/ }; do
            title="Rotation : classer $code dans rotation.json"
            if gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length' | grep -qx 0; then
              gh issue create --title "$title" --body "Le set **$code** vient d'être ajouté au manifest par \`sync_sets.py\`, mais il ne figure dans aucun bloc de \`rotation.json\`. Tant que c'est le cas, il ne compte pas dans la rotation Premier de l'app.

          - Set principal ou mini-set (comme Icons) : l'ajouter au bloc de sa marque de rotation, avec sa date de sortie officielle dans \`legalFrom\`. S'il ouvre un nouveau bloc, renseigner aussi \`legalUntil\` sur le bloc qui sort de rotation.
          - Promo, Weekly Play, convention : rien à faire, fermer cette issue.

          Voir README, section « Rotation Premier »."
            fi
          done
