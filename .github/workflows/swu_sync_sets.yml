name: SWU — Détection nouveaux sets

on:
  schedule:
    # Chaque lundi à 8h UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branche cible (main par défaut)'
        required: false
        default: 'main'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Toujours travailler sur main (données de référence).
          # En workflow_dispatch, le champ "branch" permet de cibler staging pour tester.
          ref: ${{ inputs.branch || 'main' }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests Pillow

      - name: Détecter et ajouter les nouveaux sets
        run: python3 scripts/sync_sets.py --mode sync

      - name: Commit et push si changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sets/ manifest.json
          if git diff --cached --quiet; then
            echo "Aucun nouveau set — rien à commiter."
          else
            git commit -m "Auto [sync]: nouveau(x) set(s) SWU ajouté(s) [$(date '+%Y-%m-%d')] [skip ci]"
            git push
          fi
