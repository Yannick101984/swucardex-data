name: SWU — Comparaison et mise à jour des sets

on:
  schedule:
    # Chaque mercredi à 9h UTC (actif uniquement sur la branche par défaut)
    - cron: '0 9 * * 3'
  workflow_dispatch:
    # Déclenchement manuel depuis l'onglet Actions
    # → sélectionner la branche "staging" pour tester en preprod

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests

      - name: Comparer les sets avec l'API SWU
        run: python3 scripts/sync_sets.py --mode compare

      - name: Commit et push si changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sets/ manifest.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté — rien à commiter."
          else
            git commit -m "Auto [compare]: mise à jour sets SWU [$(date '+%Y-%m-%d')] [skip ci]"
            git push
          fi
