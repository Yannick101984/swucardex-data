name: SWU — Comparaison et mise à jour des sets

on:
  schedule:
    # Chaque mercredi à 9h UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branche cible (staging par défaut, main pour production)'
        required: false
        default: 'staging'
        type: string

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'staging' }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests Pillow

      - name: Comparer les sets avec l'API SWU
        env:
          TARGET_BRANCH: ${{ inputs.branch || 'staging' }}
        run: python3 scripts/sync_sets.py --mode compare

      - name: Commit et push si changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sets/ manifest.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté — rien à commiter."
          else
            git commit -m "Auto [compare]: mise à jour sets SWU [$(date '+%Y-%m-%d')] [skip ci]"
            git push
          fi
