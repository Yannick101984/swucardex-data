name: SWU — Comparaison et mise à jour des sets

on:
  schedule:
    # Chaque mercredi à 9h UTC
    - cron: '0 9 * * 3'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        branch: [main, staging]

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests Pillow

      - name: Comparer les sets avec l'API SWU
        env:
          # GITHUB_REF_NAME vaut toujours la branche par défaut sur un trigger
          # schedule, même si le checkout ci-dessus cible staging — on force la
          # valeur pour que les dataURL générés référencent la bonne branche.
          GITHUB_REF_NAME: ${{ matrix.branch }}
        run: python3 scripts/sync_sets.py --mode compare

      - name: Commit et push si changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sets/ manifest.json announcements.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté — rien à commiter."
          else
            git commit -m "Auto [compare]: mise à jour sets SWU [$(date '+%Y-%m-%d')] [skip ci]"
            git push origin HEAD:${{ matrix.branch }}
          fi
