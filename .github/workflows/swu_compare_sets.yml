name: SWU — Comparaison et mise à jour des sets

on:
  schedule:
    # Jeudi et samedi à 5h37 UTC : après les publications du mercredi soir (UTC)
    # et les rattrapages jeudi/vendredi.
    - cron: '37 5 * * 4,6'
  workflow_dispatch:

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        branch: [main, staging]

    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install requests Pillow

      - name: Comparer les sets avec l'API SWU
        env:
          # GitHub interdit de redéfinir GITHUB_REF_NAME (elle vaut main sur un
          # trigger schedule, même dans le job staging) : sync_sets.py lit
          # DATA_BRANCH en priorité (swucardex-data#36).
          DATA_BRANCH: ${{ matrix.branch }}
        run: python3 scripts/sync_sets.py --mode compare

      # Mêmes cartes et mêmes Card.id entre JSON brut et v3 (SWUCardex#43), sinon rien n'est commité
      - name: Contrôler les formats compacts
        run: python3 scripts/check_compact.py

      - name: Commit et push si changements
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sets/ manifest.json announcements*.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté — rien à commiter."
          else
            git commit -m "Auto [compare]: mise à jour sets SWU [$(date '+%Y-%m-%d')] [skip ci]"
            git push origin HEAD:${{ matrix.branch }}
          fi
